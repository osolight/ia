name: open-webui-dev

services:

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile

    image: amanecer/open-webui:v0.11.4
    container_name: open-webui-dev

    restart: unless-stopped

    ports:
      - "10.17.71.30:3001:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      WEBUI_NAME: "IA Amanecer DEV"
      DEFAULT_LOCALE: "es-ES"

    volumes:
      - open-webui-dev-0114:/app/backend/data

volumes:
  open-webui-dev-0114:
    external: true
