server {
    listen 80;
    server_name asesor.grupo-amanecer.com;

    client_max_body_size 100M;

    # ==========================================================
    # Personalización visual Grupo Amanecer
    # ==========================================================
    location = /amanecer.css {
        alias /var/www/html/amanecer.css;
        default_type text/css;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ==========================================================
    # Open WebUI PROD
    # ==========================================================
    location / {
        proxy_pass http://10.17.71.30:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Necesario para modificar el HTML recibido
        proxy_set_header Accept-Encoding "";

        # Inyectar CSS corporativo solo en PROD
        sub_filter '</head>' '<link rel="stylesheet" href="/amanecer.css?v=2"></head>';
        sub_filter_once on;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
